<!-- 모션그래픽 견본(재생기). 이 파일은 직접 고치지 않는다.
     내용은 spec(JSON)에 쓰고 scripts/render_motion.py가 이 파일에 넣어 HTML 한 파일로 굽는다. references/motion.md 참고. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#18202b; --muted:#5d6876; --line:#c9d0d9; --grid:#e7ebf0;
  --idle:#eef1f5; --idle-ink:#5d6876;
  /* 색은 장표와 같은 규칙이다: 파랑(run)은 지금 볼 곳, 빨강(fail)은 문제. 나머지 상태는 회색이고 ✓·!·점선으로 가른다 */
  --run:#1f6fd1; --run-soft:#dbe8fb; --fail:#c8392e; --fail-soft:#f8dedb; --accent:#1f6fd1; --on-accent:#ffffff;
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --panel:#1a2029; --ink:#e6ebf1; --muted:#9aa6b4; --line:#3a4452; --grid:#232b36;
  --idle:#232b36; --idle-ink:#9aa6b4;
  --run:#6d9eff; --run-soft:#212a3b; --fail:#d9707a; --fail-soft:#2f2224; --accent:#6d9eff; --on-accent:#0b1320; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1a2029; --ink:#e6ebf1; --muted:#9aa6b4; --line:#3a4452; --grid:#232b36;
  --idle:#232b36; --idle-ink:#9aa6b4;
  --run:#6d9eff; --run-soft:#212a3b; --fail:#d9707a; --fail-soft:#2f2224; --accent:#6d9eff; --on-accent:#0b1320; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header h1{font-size:clamp(21px,2.6vw,28px);margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);max-width:80ch}
.mono{font-family:var(--font-mono)}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scen{display:flex;flex-wrap:wrap;gap:8px}
.scen button{font-size:14px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;cursor:pointer}
.scen button[aria-pressed="true"]{border-color:var(--accent);background:var(--run-soft);font-weight:600}
.main{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.stage{padding:12px 12px 0;min-width:0;overflow:hidden}
.topline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:0 4px 4px}
.clock{font-family:var(--font-mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.scname{font-weight:600}
.stepno{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;margin-left:auto}
.svgbox{overflow-x:auto}
.swipe{display:none;margin:0 4px 4px;font-size:12.5px;color:var(--muted)}
.svgbox svg{display:block;width:100%;min-width:640px;height:auto;max-height:640px;margin:0 auto}
.caption{margin:4px -12px 0;padding:12px 16px 10px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 55%,var(--panel))}
.caption p{margin:0;font-size:16.5px;line-height:1.65;min-height:3.3em;text-wrap:pretty}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:26px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 8px;background:var(--panel);cursor:pointer}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--line)}
.chip .mono{font-size:12px}
.chip.run i{background:var(--run)} .chip.ok i,.chip.wait i,.chip.skip i{background:var(--muted)}
.chip.fail i,.chip.blocked i,.chip.warn i{background:var(--fail)}
.chip.banner{cursor:default;border-color:var(--accent);background:var(--run-soft)}
.player{margin:0 -12px;padding:10px 12px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.timeline{display:flex;gap:3px;align-items:center;height:22px}
.timeline button{flex:1;height:22px;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:center}
.timeline button span{display:block;width:100%;height:7px;border-radius:4px;background:var(--grid);overflow:hidden;transition:height .15s}
.timeline button:hover span{height:11px}
.timeline button span i{display:block;height:100%;width:0;background:var(--accent)}
.timeline button.done span i{width:100%;opacity:.55}
.timeline button[aria-current="step"] span{height:11px}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;height:38px;padding:0 10px;border:1px solid var(--line);background:var(--bg);border-radius:10px;cursor:pointer;font-size:14px}
.ib:disabled{opacity:.4;cursor:default}
.ib svg{width:18px;height:18px;fill:currentColor;display:block}
.ib.play{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600;padding:0 16px;min-width:112px}
.ib[aria-pressed="false"].tog{color:var(--muted)}
.ib[aria-pressed="true"].tog{border-color:var(--accent)}
.spacer{flex:1}
.ctl-label{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
select{font:inherit;font-size:14px;height:38px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:0 8px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.hint kbd{font-family:var(--font-mono);font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--bg)}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.side .card{padding:14px 16px}
.side h2{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.out dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px}
.out dt{color:var(--muted);font-size:14px}
.out dd{margin:0;font-size:14px;font-weight:600}
.out dd.pending{font-weight:400;color:var(--muted)}
.out dd.bad,.out dd.warn{color:var(--fail)} .out dd.good::before{content:"✓ "} .out dd.warn::before{content:"! "}
.out.flash{animation:cardflash 1.4s ease-out 1}
@keyframes cardflash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.task .empty{color:var(--muted);font-size:14px;margin:0}
.task h3{font-family:var(--font-mono);font-size:15px;margin:0 0 2px}
.task .what{margin:0 0 8px;font-size:14.5px}
.task dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13.5px}
.task dt{color:var(--muted)}
.task dd{margin:0;overflow-wrap:anywhere}
.task .x{margin-top:10px;font-size:12.5px;border:0;background:none;color:var(--accent);cursor:pointer;padding:0}
.steps ol{list-style:none;margin:0;padding:0;max-height:300px;overflow-y:auto;position:relative}
.steps li button{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13.5px;line-height:1.45}
.steps li button:hover{background:var(--bg)}
.steps li button[aria-current="step"]{background:var(--run-soft)}
.steps li .tm{font-family:var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.steps li .tx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;border:2px solid var(--line);background:var(--idle)}
.legend i.run{background:var(--run-soft);border-color:var(--run)}
.legend i.wait{border-color:var(--muted);border-style:dashed}
.legend i.ok{border-color:var(--muted)}
.legend i.fail{background:var(--fail-soft);border-color:var(--fail)}
.legend i.blocked{border-color:var(--fail);border-style:dashed}
.legend i.warn{border-color:var(--fail)}
.legend i.skip{border-style:dashed}
.foot{color:var(--muted);font-size:12.5px;margin:0;overflow-wrap:anywhere}
/* SVG */
.grp{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}
.grplabel{fill:var(--muted);font-family:var(--font-mono);font-size:12px}
.edge{fill:none;stroke:var(--line);stroke-width:2;transition:stroke .4s,opacity .3s}
.edge.done{stroke:var(--muted);opacity:.55}
.edge.flow{stroke:var(--run);stroke-dasharray:7 7;animation:dash .7s linear infinite}
.edge.cut{stroke:var(--fail);stroke-dasharray:3 6;opacity:.7}
.edge.loose{stroke:var(--muted);stroke-dasharray:2 7;opacity:.6}
.edge.rel{stroke-width:4;opacity:1}
.edge.dim{opacity:.18}
.note-label{fill:var(--muted);font-size:11.5px;font-family:var(--font-body)}
@keyframes dash{to{stroke-dashoffset:-14}}
.node{cursor:pointer}
.node rect.bx{fill:var(--idle);stroke:var(--line);stroke-width:1.6;transition:fill .4s,stroke .4s}
.node rect.hl{fill:none;stroke:var(--accent);stroke-width:2;opacity:0}
.node.sel rect.hl{opacity:1}
.node:hover rect.bx{stroke-width:2.4}
.node text{pointer-events:none}
.node text.t{fill:var(--ink);font-family:var(--font-mono);font-size:13.5px;font-weight:600}
.node text.s{fill:var(--idle-ink);font-size:11.5px}
.node text.b{font-size:11px;font-weight:600;fill:var(--muted)}
.node.run rect.bx{fill:var(--run-soft);stroke:var(--run);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.72}}
.node.ok rect.bx{stroke:var(--muted)}
.node.fail rect.bx{fill:var(--fail-soft);stroke:var(--fail);stroke-width:2.4}
.node.blocked rect.bx{stroke:var(--fail);stroke-dasharray:5 4}
.node.wait rect.bx{stroke:var(--muted);stroke-dasharray:6 4}
.node.warn rect.bx{stroke:var(--fail);stroke-width:2.4}
.node.skip rect.bx{stroke-dasharray:3 4}
.node.skip text{opacity:.6}
.node.dim{opacity:.35}
.node.run text.b{fill:var(--run)} .node.ok text.b{fill:var(--ink)}
.node.fail text.b,.node.blocked text.b,.node.warn text.b{fill:var(--fail)}
.node.flash rect.bx{animation:flash .8s ease-out 1}
@keyframes flash{0%{stroke-width:6}100%{stroke-width:1.6}}
@media (max-width:620px){
  .swipe{display:block}
  .svgbox svg{min-width:560px}
  .ib .lbl{display:none}
  .ib.play{min-width:0;flex:1}
  .spacer{flex-basis:100%;height:0}
  .hint{display:none}
  .clock{font-size:26px}
}
@media (prefers-reduced-motion: reduce){
  .edge.flow,.node.run rect.bx,.node.flash rect.bx,.out.flash{animation:none}
}
</style>

<div class="wrap">
  <header>

        <div class="controls">
          <button type="button" class="ib" id="restart" title="이 시나리오 처음부터 (Home)" aria-label="처음부터"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
          <button type="button" class="ib" id="prev" title="이전 단계 (←)" aria-label="이전 단계"><svg viewBox="0 0 24 24"><path d="M15.5 5 8.5 12l7 7-1.6 1.6L5.3 12l8.6-8.6z"/></svg><span class="lbl">이전</span></button>
          <button type="button" class="ib play" id="play" title="재생/멈춤 (스페이스)"><svg viewBox="0 0 24 24" id="playicon"><path d="M7 4v16l13-8z"/></svg><span id="playlabel">재생</span></button>
          <button type="button" class="ib" id="next" title="다음 단계 (→)" aria-label="다음 단계"><span class="lbl">다음</span><svg viewBox="0 0 24 24"><path d="m8.5 5 7 7-7 7 1.6 1.6 8.6-8.6-8.6-8.6z"/></svg></button>

          </label>
          <button type="button" class="ib tog" id="cont" aria-pressed="true" title="시나리오가 끝나면 다음 시나리오로 이어서 재생">이어 보기</button>
        </div>
        <p class="hint"><kbd>스페이스</kbd> 재생·멈춤 · <kbd>←</kbd><kbd>→</kbd> 단계 · <kbd>1</kbd>~<kbd>9</kbd> 시나리오 · <kbd>Esc</kbd> 선택 해제</p>
      </div>
    </section>
    <aside class="side">
      <div class="card out" id="out" hidden><h2 id="outtitle"></h2><dl id="outdl"></dl></div>
      <div class="card task" id="task" aria-live="polite"></div>
      <div class="card steps"><h2>단계 목록</h2><ol id="steplist"></ol></div>
      <div class="legend" id="legend" aria-label="색 설명"></div>
      <p class="foot" id="source"></p>
    </aside>
  </div>
</div>

<script>
(function(){
const SPEC=/*__SPEC__*/null;
const CHECK=location.hash==="#check";
const W=180,H=48,X0=130,Y0=80,CW=200,RH=110;
const LABEL=Object.assign({idle:"아직",run:"실행 중",wait:"기다리는 중",ok:"성공",fail:"실패",blocked:"앞이 실패해 멈춤",warn:"주의",skip:"건너뜀"},SPEC.state_labels||{});
const MARK={ok:"✓ ",warn:"! ",fail:"✕ "};  // 색 대신 모양으로 상태를 보인다
const mark=(s,b)=>b?(MARK[s]||"")+b:"";
const ORDER=["idle","run","wait","ok","fail","blocked","warn","skip"];
const $=id=>document.getElementById(id);
const N={};SPEC.nodes.forEach(n=>{N[n.id]=Object.assign({},n,{x:X0+n.col*CW,y:Y0+n.row*RH});});
const E=SPEC.edges||[],SC=SPEC.scenarios;
const pair=v=>Array.isArray(v)?v:[v,null];

$("heading").textContent=SPEC.heading;
$("lead").textContent=SPEC.lead+" 재생을 누르면 단계마다 자막과 함께 끝까지 이어서 보여 줍니다. 상자를 누르면 설명이 나옵니다.";
$("source").textContent=SPEC.source||"";
$("outtitle").textContent=SPEC.result_title||"이 시나리오의 결과";
const used=new Set(["idle"]);SC.forEach(sc=>sc.steps.forEach(s=>{for(const k in (s.set||{}))used.add(pair(s.set[k])[0]);}));
ORDER.filter(s=>used.has(s)).forEach(s=>{const sp=document.createElement("span");sp.innerHTML='<i class="'+s+'"></i>';sp.appendChild(document.createTextNode(mark(s,LABEL[s])));$("legend").appendChild(sp);});

/* ---------- SVG ---------- */
const svg=$("dag"),NS="http://www.w3.org/2000/svg";
const maxX=Math.max(...SPEC.nodes.map(n=>N[n.id].x)),maxY=Math.max(...SPEC.nodes.map(n=>N[n.id].y));
svg.setAttribute("viewBox","0 0 "+(maxX+X0)+" "+(maxY+60));
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||svg).appendChild(e);return e;}
const gGrp=el("g",{}),gEdge=el("g",{}),gNode=el("g",{});
const NORM={top:[0,-1],bottom:[0,1],left:[-1,0],right:[1,0]};
function anchor(n,s){return s==="top"?[n.x,n.y-H/2]:s==="bottom"?[n.x,n.y+H/2]:s==="left"?[n.x-W/2,n.y]:[n.x+W/2,n.y];}
function sides(e){const a=N[e.from],b=N[e.to];let fs=e.from_side,ts=e.to_side;
  if(Math.abs(b.y-a.y)<H){fs=fs||(b.x>a.x?"right":"left");ts=ts||(b.x>a.x?"left":"right");}
  else if(b.y>a.y){fs=fs||"bottom";ts=ts||"top";}else{fs=fs||"top";ts=ts||"bottom";}
  return [fs,ts];}
function seg(p,dp,q,dq){const d=Math.hypot(q[0]-p[0],q[1]-p[1]),k=Math.max(30,Math.min(d*0.45,120));
  return "C"+(p[0]+dp[0]*k)+" "+(p[1]+dp[1]*k)+" "+(q[0]+dq[0]*k)+" "+(q[1]+dq[1]*k)+" "+q[0]+" "+q[1];}
function pathOf(e){const [fs,ts]=sides(e),p=anchor(N[e.from],fs),q=anchor(N[e.to],ts),a=NORM[fs],b=NORM[ts];
  if(!e.via){
    if((p[0]===q[0]&&a[0]===0&&b[0]===0)||(p[1]===q[1]&&a[1]===0&&b[1]===0))return "M"+p[0]+" "+p[1]+" L"+q[0]+" "+q[1];
    return "M"+p[0]+" "+p[1]+" "+seg(p,a,q,b);}
  const v=[X0+e.via[0]*CW,Y0+e.via[1]*RH],L=Math.hypot(q[0]-p[0],q[1]-p[1])||1,t=[(q[0]-p[0])/L,(q[1]-p[1])/L];
  return "M"+p[0]+" "+p[1]+" "+seg(p,a,v,[-t[0],-t[1]])+" "+seg(v,t,q,b);}
const edgeEls=E.map(e=>el("path",{d:pathOf(e),class:"edge"},gEdge));
const nodeEls={};
for(const k in N){
  const n=N[k];
  const g=el("g",{class:"node idle",tabindex:"0",role:"button","aria-label":k+" 설명 보기"},gNode);
  el("rect",{x:n.x-W/2-5,y:n.y-H/2-5,width:W+10,height:H+10,rx:12,class:"hl"},g);
  el("rect",{x:n.x-W/2,y:n.y-H/2,width:W,height:H,rx:9,class:"bx"},g);
  const t=el("text",{x:n.x,y:n.sub?n.y-6:n.y+5,"text-anchor":"middle",class:"t"},g);t.textContent=n.label||k;
  const s=el("text",{x:n.x,y:n.y+12,"text-anchor":"middle",class:"s"},g);s.textContent=n.sub||"";
  const b=el("text",{x:n.x,y:n.y+H/2+14,"text-anchor":"middle",class:"b"},g);
  g.addEventListener("click",()=>selectNode(sel===k?null:k));
  g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();e.stopPropagation();selectNode(sel===k?null:k);}});
  nodeEls[k]={g,b,t,s};
}
function drawGroups(sc){
  gGrp.innerHTML="";
  (sc.groups||SPEC.groups||[]).forEach(gr=>{
    const ns=(gr.nodes==="*"?Object.keys(N):gr.nodes).map(k=>N[k]);
    const x1=Math.min(...ns.map(n=>n.x))-W/2-30,y1=Math.min(...ns.map(n=>n.y))-H/2-34;
    const x2=Math.max(...ns.map(n=>n.x))+W/2+30,y2=Math.max(...ns.map(n=>n.y))+H/2+30;
    el("rect",{x:x1,y:y1,width:x2-x1,height:y2-y1,rx:16,class:"grp"},gGrp);
    el("text",{x:x1+16,y:y1+20,class:"grplabel"},gGrp).textContent=gr.label||"";
  });
  (sc.labels||[]).forEach(l=>{el("text",{x:X0+l.col*CW,y:Y0+l.row*RH,class:"note-label","text-anchor":"middle"},gGrp).textContent=l.text;});
}

/* ---------- 상태 ---------- */
const KEY="motion:"+SPEC.title;
let renderedStep=-1,scen=0,step=0,sel=null,rate=1,cont=true;
if(!CHECK){try{const v=JSON.parse(localStorage.getItem(KEY)||"{}");
  if(SC[v.scen]){scen=v.scen;step=Math.min(v.step|0,SC[scen].steps.length-1);}
  if([0.8,1,1.25,1.5].includes(v.rate))rate=v.rate; if(typeof v.cont==="boolean")cont=v.cont;
}catch(e){}}
/* 주소 끝에 #3-6을 붙이면 시나리오 3의 6단계에서 연다 */
const deep=location.hash.match(/^#(\d+)-(\d+)$/);
if(deep&&SC[+deep[1]-1]){scen=+deep[1]-1;step=Math.max(0,Math.min(+deep[2]-1,SC[scen].steps.length-1));}
function save(){if(CHECK)return;try{localStorage.setItem(KEY,JSON.stringify({scen,step,rate,cont}));}catch(e){}}
function stateAt(si,i){
  const st={},bd={};for(const k in N){st[k]="idle";bd[k]="";}
  for(let j=0;j<=i;j++){const set=SC[si].steps[j].set||{};for(const k in set){const [s,b]=pair(set[k]);st[k]=s;bd[k]=b||(s==="idle"?"":LABEL[s]);}}
  return {st,bd};
}

/* ---------- 화면 그리기 ---------- */
function buildScenTabs(){
  const box=$("scen");box.innerHTML="";
  if(SC.length<2){box.hidden=true;return;}
  SC.forEach((sc,i)=>{const b=document.createElement("button");b.type="button";b.dataset.s=i;b.textContent=sc.name;b.title="단축키 "+(i+1);
    b.onclick=()=>switchScen(i,mode==="auto"?"auto":"silent");box.appendChild(b);});
}
function buildTimeline(){
  const tl=$("timeline"),ls=$("steplist");tl.innerHTML="";ls.innerHTML="";
  SC[scen].steps.forEach((s,i)=>{
    const b=document.createElement("button");b.type="button";b.title=(s.t?s.t+" · ":"")+s.text;b.setAttribute("aria-label",(i+1)+"단계 "+(s.t||""));
    b.innerHTML="<span><i></i></span>";b.onclick=()=>jump(i);tl.appendChild(b);
    const li=document.createElement("li"),lb=document.createElement("button");lb.type="button";
    lb.innerHTML='<span class="tm"></span><span class="tx"></span>';lb.children[0].textContent=s.t||String(i+1);lb.children[1].textContent=s.text;
    lb.onclick=()=>jump(i);li.appendChild(lb);ls.appendChild(li);
  });
}
function render(flashFrom){
  const sc=SC[scen],{st,bd}=stateAt(scen,step);
  const before=step>0?stateAt(scen,step-1):null;
  drawGroups(sc);
  const loose=new Set(sc.loose||[]);
  const rel=new Set(),relNodes=new Set();
  if(sel){relNodes.add(sel);E.forEach((e,i)=>{if(e.from===sel||e.to===sel){rel.add(i);relNodes.add(e.from);relNodes.add(e.to);}});}
  for(const k in N){
    const ne=nodeEls[k],s=st[k];let c="node "+s;
    if(flashFrom&&flashFrom[k]!==s)c+=" flash";
    if(sel===k)c+=" sel";else if(sel&&!relNodes.has(k))c+=" dim";
    ne.g.setAttribute("class",c);ne.b.textContent=mark(st[k],bd[k]);
  }
  E.forEach((e,i)=>{
    const a=st[e.from],b=st[e.to];let c="edge";
    if(e.tag&&loose.has(e.tag))c+=" loose";
    else if(a==="ok"&&b==="run")c+=" flow";
    else if(a==="ok"&&(b==="ok"||b==="warn"))c+=" done";
    else if((a==="fail"||a==="blocked")&&b==="blocked")c+=" cut";
    if(sel)c+=rel.has(i)?" rel":" dim";
    edgeEls[i].setAttribute("class",c);
  });
  const s=sc.steps[step];
  $("clock").textContent=s.t||"";$("scname").textContent=sc.name;
  $("stepno").textContent=(step+1)+" / "+sc.steps.length+"단계";
  $("note").textContent=s.text;
  const chips=$("chips");chips.innerHTML="";
  for(const k in N){const now=st[k],was=before?before.st[k]:"idle",nb=bd[k],wb=before?before.bd[k]:"";
    if((now!==was||nb!==wb)&&now!=="idle"){
      const c=document.createElement("button");c.type="button";c.className="chip "+now;
      c.innerHTML='<i></i><span class="mono"></span><span></span>';
      c.children[1].textContent=N[k].label||k;c.children[2].textContent=mark(now,nb);
      c.onclick=()=>selectNode(k);chips.appendChild(c);}}
  [...$("timeline").children].forEach((b,i)=>{b.className=i<step?"done":"";
    if(i===step)b.setAttribute("aria-current","step");else b.removeAttribute("aria-current");
    const f=b.querySelector("i");if(i<step)f.style.width="";else if(i>step||renderedStep!==step)f.style.width="0";});
  renderedStep=step;
  const list=$("steplist"),lis=list.children;
  [...lis].forEach((li,i)=>{const b=li.firstChild;if(i===step)b.setAttribute("aria-current","step");else b.removeAttribute("aria-current");});
  const cur=lis[step];
  if(cur){const top=cur.offsetTop,bot=top+cur.offsetHeight;
    if(top<list.scrollTop||bot>list.scrollTop+list.clientHeight)list.scrollTop=top-list.clientHeight/2+cur.offsetHeight/2;}
  /* 결과: 마지막 단계에서만 값을 보인다 */
  const out=$("out"),dl=$("outdl");dl.innerHTML="";out.hidden=!(sc.result&&sc.result.length);
  (sc.result||[]).forEach(r=>{const dt=document.createElement("dt"),dd=document.createElement("dd");dt.textContent=r[0];
    if(step===sc.steps.length-1){dd.textContent=r[1];dd.className=r[2]||"";}else{dd.textContent="끝까지 보면 나옵니다";dd.className="pending";}
    dl.appendChild(dt);dl.appendChild(dd);});
  $("prev").disabled=step===0;
  $("next").disabled=step===sc.steps.length-1&&!(cont&&scen<SC.length-1);
  document.querySelectorAll("#scen button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.s===scen)));
}
function renderNodeCard(){
  const box=$("task");
  if(!sel){box.innerHTML='<h2>상자 설명</h2><p class="empty">그림의 상자나 자막 아래 칩을 누르면 그 상자의 설명이 여기에 나옵니다.</p>';return;}
  const n=N[sel];
  box.innerHTML='<h2>상자 설명</h2><h3></h3><p class="what"></p><dl></dl><button type="button" class="x">선택 해제</button>';
  box.querySelector("h3").textContent=n.label||sel;box.querySelector(".what").textContent=n.desc||n.sub||"";
  const dl=box.querySelector("dl");
  (n.facts||[]).forEach(f=>{const dt=document.createElement("dt"),dd=document.createElement("dd");dt.textContent=f[0];dd.textContent=f[1];dl.appendChild(dt);dl.appendChild(dd);});
  box.querySelector(".x").onclick=()=>selectNode(null);
}
function selectNode(k){sel=k;renderNodeCard();render(null);}
function setFill(f){const b=$("timeline").children[step];if(b)b.querySelector("i").style.width=(Math.max(0,Math.min(1,f))*100)+"%";}

/* ---------- 재생 ---------- */
/* mode: idle(멈춤) · auto(끝까지 이어서) · paused(재생 중 멈춤). 단계마다 자막 길이에 맞춰 머문다. */
let mode="idle",phase="done",tok=0,tmr=null,raf=null,tTotal=0,tLeft=0,tStart=0,finished=false;
function stepDur(){return Math.max(3200,SC[scen].steps[step].text.length*80)/rate;}
function stopAll(){tok++;clearTimeout(tmr);tmr=null;cancelAnimationFrame(raf);}
function fillLoop(id){cancelAnimationFrame(raf);const f=()=>{if(id!==tok)return;
  setFill((tTotal-tLeft+(performance.now()-tStart))/tTotal);raf=requestAnimationFrame(f);};raf=requestAnimationFrame(f);}
function go(i,how,fresh){
  const prev=fresh?null:stateAt(scen,step).st;
  stopAll();finished=false;phase="done";
  step=Math.max(0,Math.min(SC[scen].steps.length-1,i));
  render(prev);save();
  if(how!=="auto"){mode="idle";updateBtns();return;}
  mode="auto";updateBtns();runStep(stepDur(),true);
}
function runStep(ms,reset){
  const id=tok;phase="showing";if(reset)tTotal=ms;tLeft=ms;tStart=performance.now();clearTimeout(tmr);
  tmr=setTimeout(()=>{if(id===tok)finishStep(id);},ms);fillLoop(id);
}
function finishStep(id){cancelAnimationFrame(raf);setFill(1);phase="gap";tmr=setTimeout(()=>{if(id===tok)advance();},500/rate);}
function advance(){
  const sc=SC[scen];
  if(step<sc.steps.length-1){go(step+1,"auto");return;}
  finished=true;phase="done";
  const out=$("out");out.classList.remove("flash");void out.offsetWidth;out.classList.add("flash");
  if(cont&&scen<SC.length-1){
    const nx=scen+1,id=tok;
    const c=document.createElement("span");c.className="chip banner";c.textContent="곧 다음 시나리오로 넘어갑니다: "+SC[nx].name;$("chips").appendChild(c);
    tmr=setTimeout(()=>{if(id===tok)switchScen(nx,"auto");},3000/rate);
  }else{mode="idle";updateBtns();}
}
function pause(){
  if(mode!=="auto")return;
  clearTimeout(tmr);cancelAnimationFrame(raf);
  if(phase==="showing")tLeft-=performance.now()-tStart;
  mode="paused";updateBtns();
}
function resume(){
  if(mode==="paused"&&phase==="showing"){mode="auto";updateBtns();runStep(tLeft,false);return;}
  if(phase==="gap"){mode="auto";updateBtns();advance();return;}
  if(finished){if(cont&&scen<SC.length-1){switchScen(scen+1,"auto");return;}go(0,"auto");return;}
  go(step,"auto");
}
function toggle(){if(mode==="auto")pause();else resume();}
function jump(i){go(i,mode==="auto"?"auto":"silent");}
function next(){
  if(step<SC[scen].steps.length-1){jump(step+1);return;}
  if(cont&&scen<SC.length-1)switchScen(scen+1,mode==="auto"?"auto":"silent");
}
function switchScen(i,how){stopAll();scen=i;step=0;buildTimeline();go(0,how,true);}
const ICON={play:'<path d="M7 4v16l13-8z"/>',pause:'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>'};
function updateBtns(){
  const playing=mode==="auto";
  $("playicon").innerHTML=playing?ICON.pause:ICON.play;
  $("playlabel").textContent=playing?"멈춤":(mode==="paused"?"이어서":"재생");
  $("play").setAttribute("aria-label",playing?"멈춤":"재생");
  $("cont").setAttribute("aria-pressed",String(cont));$("cont").hidden=SC.length<2;
  $("rate").value=String(rate);
}
$("play").onclick=toggle;
$("next").onclick=next;
$("prev").onclick=()=>jump(step-1);
$("restart").onclick=()=>go(0,mode==="auto"?"auto":"silent");
$("cont").onclick=()=>{cont=!cont;save();updateBtns();render(null);};
$("rate").onchange=e=>{rate=parseFloat(e.target.value);save();if(mode==="auto"&&phase==="showing"){pause();resume();}};
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const t=e.target;if(t.closest&&(t.closest("select")||t.closest("input")))return;
  const onBtn=t.closest&&t.closest("button,.node");
  if(e.key===" "||e.key==="k"){if(onBtn&&e.key===" ")return;e.preventDefault();toggle();}
  else if(e.key==="ArrowRight"||e.key==="l"){e.preventDefault();next();}
  else if(e.key==="ArrowLeft"||e.key==="j"){e.preventDefault();jump(step-1);}
  else if(e.key==="Home"){e.preventDefault();go(0,mode==="auto"?"auto":"silent");}
  else if(e.key==="Escape"){selectNode(null);}
  else if(/^[1-9]$/.test(e.key)&&SC[+e.key-1]){switchScen(+e.key-1,mode==="auto"?"auto":"silent");}
});
buildScenTabs();buildTimeline();renderNodeCard();updateBtns();go(step,"silent",true);

/* ---------- 검사 (render_motion.py가 #check로 연다) ---------- */
if(CHECK){
  const problems=[];let failure="";
  window.addEventListener("error",e=>{failure=failure||("스크립트 오류: "+e.message);});
  const report=()=>{const p=document.createElement("pre");p.hidden=true;p.textContent="MOTION-"+"REPORT:"+encodeURIComponent(JSON.stringify({failure,problems}));document.body.appendChild(p);};
  const measure=()=>{
    for(const k in N){
      if(nodeEls[k].t.getComputedTextLength()>W-12)problems.push("상자 이름이 상자보다 길다: "+k);
      if(nodeEls[k].s.getComputedTextLength()>W-10)problems.push("상자 부제(sub)가 상자보다 길다: "+k);
    }
    E.forEach((e,i)=>{const p=edgeEls[i],len=p.getTotalLength();
      scan:for(let d=0;d<=len;d+=5){const pt=p.getPointAtLength(d);
        for(const k in N){if(k===e.from||k===e.to)continue;const n=N[k];
          if(Math.abs(pt.x-n.x)<W/2+4&&Math.abs(pt.y-n.y)<H/2+4){problems.push("화살표 "+e.from+" → "+e.to+"가 상자 "+k+"를 지나간다. via나 from_side·to_side로 길을 돌린다");break scan;}}}});
  };
  const walk=()=>{SC.forEach((sc,si)=>{switchScen(si,"silent");sc.steps.forEach((s,i)=>go(i,"silent"));});
    for(const k in N){selectNode(k);}selectNode(null);};
  const autoplay=()=>{rate=200;cont=true;switchScen(0,"auto");const t0=performance.now();
    const iv=setInterval(()=>{
      if(finished&&scen===SC.length-1&&mode==="idle"){clearInterval(iv);report();}
      else if(performance.now()-t0>12000){clearInterval(iv);failure=failure||"자동 재생이 마지막 단계까지 가지 못했다.";report();}
    },40);};
  const start=()=>{try{measure();walk();autoplay();}catch(err){failure="스크립트 오류: "+err.message;report();}};
  let started=false;const once=()=>{if(!started){started=true;start();}};
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(once);setTimeout(once,2500);}else once();
}
})();
</script>
